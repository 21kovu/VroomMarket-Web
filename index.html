function bookT(){const r=[...mine(db.bookings)].sort((a,b)=>(a.status==='Pending'?0:1)-(b.status==='Pending'?0:1)||String(a.date).localeCompare(b.date));
$('tabBody').innerHTML=tb(['Buyer','Phone','Car','Dealer','Date','Time','Status','Actions'],r.map(b=>`<tr><td>${esc(b.name)}</td><td>${esc(b.phone)}</td><td>${esc(title(car(b.car)))}</td><td>${esc(dealer(b.dealer).name)}</td><td>${b.date}</td><td>${b.time}</td><td>${st(b.status)}</td><td><button class="btn sm o" onclick="viewB(${b.id})">View</button>${b.status==='Pending'?`<button class="btn sm" onclick="decide(${b.id},'Approved')">Approve</button><button class="btn sm x" onclick="decide(${b.id},'Rejected')">Reject</button>`:''}</td></tr>`))}
function viewB(id){const b=db.bookings.find(x=>x.id===id),c=car(b.car);$('modal').innerHTML=`<div class="mb"><button class="btn o sm" style="float:right" onclick="closeM()">✕ Close</button><h3>Viewing request ${st(b.status)}</h3><div class="specs">${row('BUYER',esc(b.name))}${row('PHONE',`<a href="tel:${esc(b.phone)}">${esc(b.phone)}</a>`)}${row('CAR',esc(title(c)))}${row('DEALER',esc(dealer(b.dealer).name))}${row('DATE',b.date)}${row('TIME',b.time)}</div><p><b>Message:</b> ${esc(b.msg)||'<i>none</i>'}</p><p class="meta">Requested ${String(b.created||'').slice(0,16).replace('T',' ')}</p><div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">${b.status==='Pending'?`<button class="btn" onclick="decide(${b.id},'Approved').then(closeM)">Approve</button><button class="btn x" onclick="decide(${b.id},'Rejected').then(closeM)">Reject</button>`:''}<a class="btn wa" style="text-decoration:none" target="_blank" href="https://wa.me/${String(b.phone).replace(/\D/g,'').replace(/^0/,'254')}">💬 WhatsApp buyer</a></div></div>`;$('mbg').classList.add('on')}
inqT=function(){const r=[...mine(db.inquiries)].reverse(),ids=r.filter(i=>!i.read).map(i=>i.id);
$('tabBody').innerHTML=tb(['Date','Type','From','Contact','Car','Message',''],r.map(i=>`<tr><td>${i.date}</td><td><span class="pill ${i.type==='Trade-in offer'?'p':''}">${esc(i.type)}</span></td><td>${i.read?'':'🔵 '}${esc(i.name)}</td><td>${esc(i.contact)}</td><td>${esc(title(car(i.car)))}</td><td>${esc(String(i.msg).slice(0,40))}${String(i.msg).length>40?'…':''}</td><td><button class="btn sm o" onclick="viewI(${i.id})">View</button></td></tr>`));
if(ids.length)sb.from('inquiries').update({read:true}).in('id',ids).then(()=>{ids.forEach(x=>{const i=db.inquiries.find(y=>y.id===x);if(i)i.read=true})})};
function viewI(id){const i=db.inquiries.find(x=>x.id===id),ct=String(i.contact||''),link=ct.includes('@')?`mailto:${esc(ct)}`:`https://wa.me/${ct.replace(/\D/g,'').replace(/^0/,'254')}`;
$('modal').innerHTML=`<div class="mb"><button class="btn o sm" style="float:right" onclick="closeM()">✕ Close</button><h3>${esc(i.type)}</h3><div class="specs">${row('FROM',esc(i.name))}${row('CONTACT',esc(ct))}${row('CAR',esc(title(car(i.car))))}${row('DEALER',esc(dealer(i.dealer).name))}${row('DATE',i.date)}</div><p style="white-space:pre-wrap">${esc(i.msg)}</p><div style="margin-top:14px"><a class="btn wa" style="text-decoration:none" target="_blank" href="${link}">Reply</a></div></div>`;$('mbg').classList.add('on')}
let U=[];const PERMS=[['book','Bookings'],['inq','Inquiries'],['cars','Listings'],['dealers','Dealers'],['reports','Reports']];
async function usersT(){const{data,error}=await sb.from('profiles').select('*').order('role');if(error)return toast(error.message);U=data;
$('tabBody').innerHTML=`<div class="panel"><h3>Add a staff member</h3><p class="sub" style="margin:4px 0 0">Staff log in to the same dashboard and only see the sections you allow below.</p><div class="f4" style="grid-template-columns:repeat(3,1fr)"><div><label>Name</label><input id="st_name"></div><div><label>Email</label><input id="st_email" type="email"></div><div><label>Temporary password</label><input id="st_pass" type="password" autocomplete="new-password"></div></div><button class="btn" style="margin-top:14px" onclick="addStaff()">Create staff account</button></div>`+
tb(['User','Role','Access','Status','Actions'],U.map(u=>{const self=u.id===me.id;return `<tr><td><b>${esc(u.name||'—')}</b><br><span class="meta">${esc(u.email||'')}${self?' (you)':''}</span></td><td><select style="width:auto" ${self?'disabled':''} onchange="setRole('${u.id}',this.value)">${opt(['admin','staff','dealer'],u.role).replace(/<option( selected)?>(\w+)/g,(m,a,v)=>`<option value="${v}"${a||''}>${v}`)}</select></td><td style="white-space:normal;min-width:260px">${u.role==='staff'?PERMS.map(p=>`<label style="display:inline-flex;gap:4px;margin:2px 10px 2px 0;font-weight:400"><input type="checkbox" style="width:auto" ${(u.perms||{})[p[0]]?'checked':''} onchange="setPerm('${u.id}','${p[0]}',this.checked)">${p[1]}</label>`).join(''):u.role==='admin'?'Full access':'Own listings & customers only'}</td><td>${u.restricted?'<span class="pill b">Restricted</span>':'<span class="pill">Active</span>'}</td><td>${self?'—':`<button class="btn sm ${u.restricted?'':'x'}" onclick="restrictU('${u.id}',${!u.restricted})">${u.restricted?'Allow access':'Restrict'}</button>`}</td></tr>`}))}
async function setPerm(id,k,v){const u=U.find(x=>x.id===id),p={...(u.perms||{}),[k]:v};const{error}=await sb.from('profiles').update({perms:p}).eq('id',id);if(error)return toast(error.message);u.perms=p;toast('Permission saved')}
async function setRole(id,r){if(await run(sb.from('profiles').update({role:r}).eq('id',id))){toast('Role changed to '+r);usersT()}}
async function restrictU(id,v){if(await run(sb.from('profiles').update({restricted:v}).eq('id',id))){toast(v?'User restricted — they can no longer log in or edit data':'Access restored');usersT()}}
async function addStaff(){const v=k=>$('st_'+k).value.trim();if(!v('name')||!v('email')||v('pass').length<6)return toast('Name, email and a 6+ character password are required');
const tmp=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false}});const{data,error}=await tmp.auth.signUp({email:v('email'),password:v('pass')});
if(error||!data.user)return toast(error?error.message:'Could not create user');
if(await run(sb.from('profiles').insert({id:data.user.id,role:'staff',name:v('name'),email:v('email'),perms:{book:true,inq:true}}))){toast('Staff created (bookings + inquiries allowed by default)');usersT()}}
boot();
</script></body></html>
