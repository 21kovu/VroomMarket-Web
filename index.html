({rem:remT,agr:agrT,comm:commT,users:usersT,cars:invT,inv:invT,add:addT,book:bookT,inq:inqT,dealers:dealersT,sales:salesT,reports:repT})[tab]()}

['9. DISPUTE RESOLUTION',[`9.1 Any dispute arising from this Agreement shall first be resolved through negotiation between the parties.`,`9.2 If negotiation fails, the dispute shall be referred to mediation in Nairobi.`,`9.3 If mediation fails, the dispute shall be resolved by the courts of Kenya.`]],

$('tabBody').innerHTML=`<div class="panel"><b>${L.filter(x=>!x.reviewed).length}</b> removal(s) waiting for review. A 🚩 means the buyer's phone matches someone who contacted the dealer through VroomMarket, so commission applies.</div>`+tb(['Date','Dealer','Car','Reason','Buyer','Phone','Price','Leads','Check','Actions'],L.map(r=>{const ph=waNum(r.buyer_phone),leads=[...db.bookings,...db.inquiries].filter(x=>x.car==r.car),hit=ph&&leads.some(x=>waNum(x.phone||x.contact)===ph),via=r.reason==='sold_via_vroom';
const chk=hit?(via?'✅ Matches a lead':'🚩 Buyer matches a VroomMarket lead'):(!via&&leads.length?`⚠️ Had ${leads.length} lead(s)`:'—');
return `<tr><td>${esc(String(r.created).slice(0,10))}</td><td>${esc(dealer(r.dealer).name)}</td><td>${esc(r.car_title)}</td><td>${esc(RSN[r.reason]||r.reason)}<br><span class="meta">${esc(r.note||'')}</span></td><td>${esc(r.buyer_name||'—')}</td><td>${esc(r.buyer_phone||'—')}</td><td>${r.sold_price?KES(r.sold_price):'—'}</td><td>${r.bookings} bookings, ${r.enquiries} enquiries</td><td>${chk}</td><td>${r.buyer_phone?`<a class="btn sm wa" style="text-decoration:none" target="_blank" href="https://wa.me/${ph}?text=${encodeURIComponent('Hello, VroomMarket here. Please confirm you bought the '+r.car_title+'. Thank you!')}">Verify with buyer</a>`:''}${r.sold_price&&!r.sale_recorded&&!via?`<button class="btn sm" onclick="remSale(${r.id})">Record sale</button>`:''}<button class="btn sm o" onclick="remDone(${r.id},${!r.reviewed})">${r.reviewed?'Reviewed ✓':'Mark reviewed'}</button></td></tr>`}))}
async function remDone(id,v){const{error}=await sb.from('removals').update({reviewed:v}).eq('id',id);if(error)return toast(error.message);remT()}
async function remSale(id){const{data:r}=await sb.from('removals').select('*').eq('id',id).single();if(!r)return;
const{error}=await sb.from('sales').insert({dealer:r.dealer,car:r.car,title:r.car_title,amount:r.sold_price,date:new Date().toISOString().slice(0,10),note:'From removal report — buyer '+(r.buyer_name||'')+' '+(r.buyer_phone||'')});if(error)return toast(error.message);
await sb.from('removals').update({sale_recorded:true,reviewed:true}).eq('id',id);await refresh();toast('Sale recorded — see the Commission tab');remT()}

function safeGate(kind,id){const c=car(id),d=dealer(c.dealer);
window._safeGo=kind==='wa'?()=>window.open('https://wa.me/'+waNum(d.wa||d.phone)+'?text='+encodeURIComponent('Hi, I am interested in the '+title(c)+' on VroomMarket')):()=>{location.href='tel:'+d.phone};
let o=$('safe');if(!o){o=document.createElement('div');o.id='safe';o.className='mbg';o.style.zIndex=150;o.onclick=e=>{if(e.target===o)o.classList.remove('on')};document.body.appendChild(o)}
o.innerHTML=`<div class="modal" style="max-width:460px"><div class="mb"><h3>🛡️ Stay safe — book a viewing first</h3><ul style="margin:12px 0 14px 20px;line-height:1.6;font-size:14px"><li><b>Schedule a free viewing</b> here first, so your visit is on record with the dealer and VroomMarket.</li><li><b>Never send a deposit or full payment</b> before you have seen the car and checked the logbook and ownership details.</li><li>Meet at the dealer's yard or another public place, and bring someone with you.</li><li>Be careful with offers that are far below market price or that pressure you to pay quickly.</li></ul><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="safeBook()">📅 Schedule a view</button><button class="btn o" onclick="safeGo()">${kind==='wa'?'Continue to WhatsApp':'Continue to call'}</button></div></div></div>`;o.classList.add('on')}
function safeBook(){$('safe').classList.remove('on');$('bk').classList.remove('hide');drawSlots();$('bk').scrollIntoView({behavior:'smooth',block:'center'})}
function safeGo(){$('safe').classList.remove('on');window._safeGo()}
function waCar(id){safeGate('wa',id)}
function callCar(id){safeGate('call',id)}
boot();
</script></body></html>
